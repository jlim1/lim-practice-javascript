<!doctype html>
<html lang="en">
    <meta charset="utf-8" /><title>Click handler</title
    ><button type="button">Touch me</button>
    <script>
        // The click listener opens the dialog when the button is activated.
        document
            .querySelector("button")
            .addEventListener("click", () => alert("Ouch!"));
    </script>
</html>
